version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg14
    restart: always
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: search_engine_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
